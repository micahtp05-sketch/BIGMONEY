<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

  <nav id="sidebar">

      <h1 class="brand">Commons<small>ask for help · join a group · find company</small></h1>

    <div id="channelNav"></div>
