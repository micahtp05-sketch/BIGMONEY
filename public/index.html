<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">Commons</a>
    <form id="searchForm" role="search">
      <label class="lab" for="searchInput" hidden>Search</label>
      <input id="searchInput" type="search" placeholder="Search" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <div id="account"></div>
  </div>
</header>

<nav class="main" aria-label="Main">
  <ul id="nav"></ul>
</nav>

<main id="view"></main>

<div id="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>

<script type="module" src="/commons.js"></script>
<script>
  // Registered after load so it never competes with the first paint. It only
  // caches the shell; posts and people always come from the network.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
