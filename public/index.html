<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commons</title>
<meta name="description" content="Rooms for every trade. Groups you start yourselves. Company when you want it.">
<meta name="theme-color" content="#080D16">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%23080D16%27/%3E%3Ccircle%20cx%3D%2711%27%20cy%3D%2712%27%20r%3D%274%27%20fill%3D%27%23fff%27/%3E%3Ccircle%20cx%3D%2721%27%20cy%3D%2712%27%20r%3D%274%27%20fill%3D%27%23fff%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2721.5%27%20r%3D%274%27%20fill%3D%27%23fff%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commons">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preload" href="/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/public-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('commons-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/commons.css">
</head>
<body>

<header class="top">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="top-in">
    <button id="roomsToggle" class="rooms-toggle" type="button" aria-controls="rooms" aria-expanded="false">Rooms</button>
    <a class="brand" href="#/">Commons</a>
    <form id="searchForm" role="search">
      <label class="lab" for="searchInput" hidden>Search</label>
      <input id="searchInput" type="search" placeholder="Search" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <div id="account"></div>
  </div>
</header>

<nav class="main" aria-label="Main">
  <ul id="nav"></ul>
</nav>

<div class="layout">
  <aside id="rooms" class="rail" aria-label="Rooms">
    <div class="rail-head">
      <span class="rail-title">Rooms</span>
      <button id="themeToggle" class="quiet" type="button">Turn lights off</button>
      <button id="roomsClose" class="quiet" type="button">Close</button>
    </div>
    <div id="roomList"></div>
  </aside>
  <main id="view"></main>
</div>

<div id="toast" role="status" hidden></div>
<div id="arrivals" class="sr" role="status"></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>

<script type="module" src="/commons.js"></script>
<script>
  // Registered after load so it never competes with the first paint. It only
  // caches the shell; posts and people always come from the network.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
