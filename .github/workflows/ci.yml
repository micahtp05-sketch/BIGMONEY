name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Sync the native app projects (so their checks run too)
        run: npm run app:sync
      - name: Unit and API tests (offline)
        run: npm test
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Interface, install and cinematic checks in a real browser
        run: npm run test:e2e
